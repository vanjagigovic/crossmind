name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crossmind
          POSTGRES_PASSWORD: crossmind
          POSTGRES_DB: crossmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossmind -d crossmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://crossmind:crossmind@127.0.0.1:5432/crossmind

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate --workspace=backend

      - name: Run backend lint
        run: npm run lint --workspace=backend

      - name: Run backend tests
        run: npm test --workspace=backend

      - name: Check backend formatting
        run: npm run format:check --workspace=backend

      - name: Build backend
        run: npm run build --workspace=backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint --workspace=frontend

      - name: Check frontend formatting
        run: npm run format:check --workspace=frontend

      - name: Run frontend tests
        run: npm test --workspace=frontend

      - name: Build frontend
        run: npm run build --workspace=frontend
